spring.application.name=Mystery_Rooms_Back_End

# MariaDB / MySQL en XAMPP local
spring.datasource.url=jdbc:mariadb://localhost:8080/mystery_rooms?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect

# JWT  (HS256 requiere al menos 256 bits = 32 bytes en Base64)
